# Tidemark Billing with MariaDB:  docker compose -f docker-compose.mysql.yml up -d
# At http://localhost:8080/install choose "MySQL / MariaDB" with host "db", database "billing", user "billing".
services:
  billing:
    image: ghcr.io/tidemark-analytics/tidemark-billing:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - billing-data:/data
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: billing
      DB_USERNAME: billing
      DB_PASSWORD: change-me

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: billing
      MARIADB_USER: billing
      MARIADB_PASSWORD: change-me
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

volumes:
  billing-data:
  db-data:
